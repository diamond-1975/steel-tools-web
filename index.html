<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Truss Pipe CNC Configurator V1 (Multi-Lang + Miter Cut)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        #app-container { position: relative; width: 100%; height: 720px; overflow: hidden; border-radius: 8px; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { width: 100%; height: 100%; background: #0f172a; }
        
        #global-panel {
            position: absolute; top: 10px; left: 10px; right: 10px; 
            background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(4px);
            color: white; padding: 10px 15px; border-radius: 8px; border: 1px solid #334155;
            display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; z-index: 10;
        }
        .global-input label { font-size: 11px; color: #94a3b8; display: block; margin-bottom: 2px; }
        .global-input input, .global-input select { width: 85px; background: #0f172a; border: 1px solid #475569; color: white; padding: 4px; border-radius: 4px; font-size: 13px; }
        #lang-selector { width: 100px; }

        #property-panel {
            position: absolute; top: 90px; right: 10px; width: 310px;
            background: rgba(15, 23, 42, 0.95); border: 1px solid #334155;
            color: white; padding: 15px; border-radius: 8px;
            display: none; transform: translateX(120%); transition: transform 0.3s; z-index: 10;
        }
        #property-panel.active { display: block; transform: translateX(0); }
        .input-group { margin-bottom: 8px; }
        .input-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 2px; }
        .input-group input, .input-group select { width: 100%; background: #0f172a; border: 1px solid #475569; color: white; padding: 6px; border-radius: 4px; font-size: 13px; }
        
        .meas-label {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #0d9488;
            color: #5eead4;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
            pointer-events: none; 
            white-space: nowrap;
            margin-top: -10px;
        }
        .angle-label {
            color: #fbbf24;
            border-color: #d97706;
            font-size: 11px;
        }
    </style>
</head>
<body>

<div id="app-container">
    <div id="canvas-container"></div>
    
    <div id="global-panel">
        <div class="global-input">
            <label data-i18n="lang_label">🌍 Language</label>
            <select id="lang-selector" onchange="changeLanguage(this.value)" style="border-color: #3b82f6;">
                <option value="th">🇹🇭 ไทย</option>
                <option value="en">🇬🇧 English</option>
                <option value="zh">🇨🇳 中文</option>
            </select>
        </div>

        <div class="global-input border-l pl-2 border-slate-600">
            <label class="text-purple-400 font-bold">รูปแบบการกำหนดค่า</label>
            <select id="glb-input-mode" onchange="toggleInputMode()" style="border-color: #c084fc; width: 170px;">
                <option value="angle">1. ระบุมุมองศา</option>
                <option value="height">2. สูงซ้าย (เมนล่างระนาบพื้น)</option>
            </select>
        </div>

        <div class="global-input mode-angle">
            <label class="text-orange-400">องศาเมนล่าง (+ซ้ายสูง)</label>
            <input type="number" id="glb-ang-bot" value="0" step="0.5" onchange="updateGlobalTruss()">
        </div>
        <div class="global-input mode-angle">
            <label class="text-pink-400">องศาเมนบน (+ซ้ายสูง)</label>
            <input type="number" id="glb-ang-top" value="10" step="0.5" onchange="updateGlobalTruss()">
        </div>

        <div class="global-input mode-height hidden">
            <label class="text-pink-400 font-bold">สูงซ้าย (H1 - mm)</label>
            <input type="number" id="glb-h-left" value="976.3" step="1" onchange="updateGlobalTruss()">
        </div>

        <!-- --- ย้ายสูงขวามาไว้ตรงนี้ เพื่อให้อยู่ติดกับสูงซ้าย --- -->
        <div class="global-input border-l pl-2 border-slate-600">
            <label class="font-bold text-white">สูงขวา (H2 - mm)</label>
            <input type="number" id="glb-height" value="800" onchange="updateGlobalTruss()">
        </div>
        <div class="global-input">
            <label class="font-bold text-white">กว้าง (Span - mm)</label>
            <input type="number" id="glb-span" value="1000" onchange="updateGlobalTruss()">
        </div>

        <div class="global-input border-l pl-2 border-slate-600">
            <label class="text-purple-400 font-bold" data-i18n="miter_right">แบบจบขวาสุด</label>
            <select id="glb-miter-right" onchange="updateGlobalTruss()" style="border-color: #c084fc; width: 120px;">
                <option value="0" data-i18n="miter_saddle">1. ชนฉาก (Saddle)</option>
                <option value="1" data-i18n="miter_miter">2. บากมุม (Miter)</option>
            </select>
        </div>

        <div class="global-input border-l pl-2 border-slate-600">
            <label class="text-green-400 font-bold" data-i18n="offset">ระยะร่นตัวทแยง (0 = มุม)</label>
            <input type="number" id="glb-offset" value="0" step="1" onchange="updateGlobalTruss()" style="border-color: #22c55e;">
        </div>
        <div class="flex gap-1">
            <button data-i18n="btn_diag" onclick="toggleDiagonal()" type="button" class="bg-slate-700 border border-slate-500 hover:bg-slate-600 text-white py-1 px-3 rounded text-xs h-full">
                🔄 สลับตัวทแยง
            </button>
        </div>
    </div>
    
    <div id="property-panel">
        <div class="flex justify-between items-center mb-3">
            <h3 id="panel-title" class="font-bold text-teal-400 border-b border-teal-700 pb-1 flex-1" data-i18n="panel_title">เลือกชิ้นส่วน...</h3>
            <button onclick="closePanel()" class="text-slate-400 hover:text-red-400 ml-2">✖</button>
        </div>
        
        <div class="grid grid-cols-2 gap-2">
            <div class="input-group">
                <label data-i18n="od">OD (mm)</label>
                <input type="number" id="inp-od" value="114.3" step="0.1">
            </div>
            <div class="input-group">
                <label data-i18n="thk">หนา (mm)</label>
                <input type="number" id="inp-thk" value="3.2" step="0.1">
            </div>
        </div>
        
        <div class="input-group" id="phase-group">
            <label class="text-purple-400" data-i18n="phase">องศาเริ่มคลี่ (90° = สมมาตร)</label>
            <input type="number" id="inp-phase" value="90" step="5">
        </div>

        <div class="input-group">
            <label data-i18n="paper_setup">ตั้งค่ากระดาษ PDF</label>
            <div class="flex gap-2">
                <select id="inp-paper" class="flex-1">
                    <option value="a4">A4</option>
                    <option value="a3">A3</option>
                    <option value="a2">A2</option>
                    <option value="a1">A1</option>
                    <option value="a0">A0</option>
                </select>
                <select id="inp-orient" class="flex-1">
                    <option value="landscape" data-i18n="orient_land">แนวนอน</option>
                    <option value="portrait" data-i18n="orient_port">แนวตั้ง</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label data-i18n="true_len">True Length (ระยะแกนท่อ)</label>
            <input type="number" id="inp-len" readonly class="opacity-50 text-teal-300 font-mono">
        </div>
        
        <button data-i18n="btn_update" onclick="applyChanges()" type="button" class="w-full mt-2 bg-teal-600 hover:bg-teal-500 text-white font-bold py-2 rounded text-sm mb-2">
            อัปเดตโมเดล
        </button>

        <div class="flex gap-2">
            <button id="btn-dxf" data-i18n="btn_dxf" onclick="generateCNC_DXF()" type="button" class="flex-1 bg-orange-600 hover:bg-orange-500 text-white font-bold py-2 rounded text-xs hidden">
                🔥 DXF (CNC)
            </button>
            <button id="btn-pdf" data-i18n="btn_pdf" onclick="generateTemplate_PDF()" type="button" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-2 rounded text-xs hidden">
                📄 PDF (ทาบตัด)
            </button>
        </div>
    </div>
</div>

<script>
    const i18n = {
        "lang_label": { th: "🌍 ภาษา / Language", en: "🌍 Language", zh: "🌍 语言" },
        "miter_right": { th: "แบบจบขวาสุด", en: "Right End Type", zh: "右端类型" },
        "miter_saddle": { th: "1. ชนฉาก (Saddle)", en: "1. Saddle Cut", zh: "1. 鞍形切割" },
        "miter_miter": { th: "2. บากมุม (Miter)", en: "2. Miter Cut", zh: "2. 斜角切割" },
        "offset": { th: "ระยะร่นตัวทแยง (0 = มุม)", en: "Diagonal Offset", zh: "斜管偏移" },
        "btn_diag": { th: "🔄 สลับตัวทแยง", en: "🔄 Toggle Diagonals", zh: "🔄 切换斜管" },
        "panel_title": { th: "เลือกชิ้นส่วน...", en: "Select Part...", zh: "选择部件..." },
        "od": { th: "OD (mm)", en: "OD (mm)", zh: "外径 (mm)" },
        "thk": { th: "หนา (mm)", en: "Thickness (mm)", zh: "厚度 (mm)" },
        "phase": { th: "องศาเริ่มคลี่ (90° = สมมาตร)", en: "Unwrap Phase (90°=Sym)", zh: "展开相位 (90°=对称)" },
        "paper_setup": { th: "ตั้งค่ากระดาษ PDF", en: "PDF Paper Setup", zh: "PDF 纸张设置" },
        "orient_land": { th: "แนวนอน", en: "Landscape", zh: "横向" },
        "orient_port": { th: "แนวตั้ง", en: "Portrait", zh: "纵向" },
        "true_len": { th: "True Length (ระยะแกนท่อ)", en: "True Length", zh: "真实长度" },
        "btn_update": { th: "อัปเดตโมเดล", en: "Update Model", zh: "更新模型" },
        "btn_dxf": { th: "🔥 DXF (CNC)", en: "🔥 DXF (CNC)", zh: "🔥 DXF (CNC)" },
        "btn_pdf": { th: "📄 PDF (ทาบตัด)", en: "📄 PDF (Template)", zh: "📄 PDF (样板)" },
        "alert_pdf": { 
            th: "⚠️ แจ้งเตือน:\nแผ่นคลี่ต้องการพื้นที่ใหญ่กว่ากระดาษ\nระบบจะพิมพ์ให้ตามปกติแต่อาจล้นขอบกระดาษครับ", 
            en: "⚠️ Warning:\nThe template requires a larger area than the selected paper size.\nIt will print normally but may overflow the edges.", 
            zh: "⚠️ 警告:\n展开图需要的面积大于所选纸张尺寸。\n系统将正常打印，但可能会超出纸张边缘。" 
        }
    };

    let currentLang = 'th';

    function changeLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (i18n[key] && i18n[key][lang]) {
                el.innerHTML = i18n[key][lang];
            }
        });
        localStorage.setItem('pipecut_lang', lang);
    }

    window.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem('pipecut_lang') || 'th';
        const langSelector = document.getElementById('lang-selector');
        if (langSelector) langSelector.value = savedLang;
        changeLanguage(savedLang);
    });

    let scene, camera, renderer, controls, raycaster, mouse;
    let labelRenderer; 
    let labelsGroup = new THREE.Group(); 
    
    let selectedEdgeId = null;
    let diagDirection = 1; 
    let helperMeshes = []; 

    const nodes = {
        'N1': new THREE.Vector3(), 'N2': new THREE.Vector3(),
        'N3': new THREE.Vector3(), 'N4': new THREE.Vector3(),
        'N_D1': new THREE.Vector3(), 'N_D2': new THREE.Vector3()
    };

    const edges = [
        { id: 'E1', type: 'Main Bottom', start: 'N1', end: 'N2', color: 0xff3333, baseOD: 114.3, thk: 3.2, isBuilt: true },
        { id: 'E2', type: 'Main Top', start: 'N3', end: 'N4', color: 0xff3333, baseOD: 114.3, thk: 3.2, isBuilt: true },
        { id: 'E3', type: 'Vertical Left', start: 'N1', end: 'N3', color: 0x3366ff, baseOD: 76.3, thk: 3.2, isBuilt: true },
        { id: 'E4', type: 'Vertical Right', start: 'N2', end: 'N4', color: 0x3366ff, baseOD: 76.3, thk: 3.2, isBuilt: true },
        { id: 'E5', type: 'Diagonal', start: 'N_D1', end: 'N_D2', color: 0xffcc00, baseOD: 60.5, thk: 2.3, isBuilt: true }
    ];

    init();
    updateGlobalTruss();
    animate();

    function init() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.add(labelsGroup); 
        
        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 10000);
        camera.position.set(500, 400, 2500);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.setSize(container.clientWidth, container.clientHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none'; 
        container.appendChild(labelRenderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(500, 400, 0);
        
        controls.mouseButtons = {
            LEFT: THREE.MOUSE.ROTATE,
            MIDDLE: THREE.MOUSE.PAN,
            RIGHT: THREE.MOUSE.PAN
        };
        
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(1000, 1500, 1000);
        scene.add(dirLight);

        const grid = new THREE.GridHelper(5000, 50, 0x334155, 0x1e293b);
        grid.position.y = -100;
        scene.add(grid);

        raycaster = new THREE.Raycaster();
        raycaster.params.Line.threshold = 20;
        mouse = new THREE.Vector2();

        container.addEventListener('pointerdown', onPointerDown);

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            labelRenderer.setSize(container.clientWidth, container.clientHeight); 
        });
    }

    function toggleInputMode() {
        const mode = document.getElementById('glb-input-mode').value;
        const modeAngle = document.querySelectorAll('.mode-angle');
        const modeHeight = document.querySelectorAll('.mode-height');
        
        if (mode === 'angle') {
            modeAngle.forEach(el => el.classList.remove('hidden'));
            modeHeight.forEach(el => el.classList.add('hidden'));
        } else {
            modeAngle.forEach(el => el.classList.add('hidden'));
            modeHeight.forEach(el => el.classList.remove('hidden'));
        }
        updateGlobalTruss();
    }

    function calcDiagNodes() {
        let offset = parseFloat(document.getElementById('glb-offset').value) || 0;
        let pLBase, pRBase, dirTop, dirBot;

        if(diagDirection === 1) {
            pLBase = nodes['N3']; pRBase = nodes['N2']; 
            dirTop = new THREE.Vector3().subVectors(nodes['N4'], nodes['N3']).normalize();
            dirBot = new THREE.Vector3().subVectors(nodes['N1'], nodes['N2']).normalize();
        } else {
            pLBase = nodes['N1']; pRBase = nodes['N4']; 
            dirTop = new THREE.Vector3().subVectors(nodes['N2'], nodes['N1']).normalize();
            dirBot = new THREE.Vector3().subVectors(nodes['N3'], nodes['N4']).normalize();
        }

        nodes['N_D1'].copy(pLBase).addScaledVector(dirTop, offset);
        nodes['N_D2'].copy(pRBase).addScaledVector(dirBot, offset);
    }

    function updateGlobalTruss() {
        const span = parseFloat(document.getElementById('glb-span').value) || 1000;
        const hRight = parseFloat(document.getElementById('glb-height').value) || 800; 
        const mode = document.getElementById('glb-input-mode').value;
        
        let leftY_Bot, leftY_Top;

        if (mode === 'angle') {
            const angBot = (parseFloat(document.getElementById('glb-ang-bot').value) || 0) * (Math.PI / 180); 
            const angTop = (parseFloat(document.getElementById('glb-ang-top').value) || 0) * (Math.PI / 180); 
            
            leftY_Bot = span * Math.tan(angBot);
            leftY_Top = hRight + (span * Math.tan(angTop));
            
            document.getElementById('glb-h-left').value = leftY_Top.toFixed(1);
        } else {
            leftY_Bot = 0; 
            leftY_Top = parseFloat(document.getElementById('glb-h-left').value) || 800;
            
            document.getElementById('glb-ang-bot').value = "0";
            const aTop = Math.atan((leftY_Top - hRight) / span) * (180 / Math.PI);
            document.getElementById('glb-ang-top').value = aTop.toFixed(2);
        }

        nodes['N2'].set(span, 0, 0); 
        nodes['N4'].set(span, hRight, 0); 
        nodes['N1'].set(0, leftY_Bot, 0); 
        nodes['N3'].set(0, leftY_Top, 0); 
        
        calcDiagNodes();

        const isMiterRight = document.getElementById('glb-miter-right') && document.getElementById('glb-miter-right').value === '1';
        if (isMiterRight) {
            const e1 = edges.find(e => e.id === 'E1');
            const e2 = edges.find(e => e.id === 'E2');
            const e4 = edges.find(e => e.id === 'E4');
            if(e1 && e2 && e4) {
                e4.baseOD = e2.baseOD;
                e4.thk = e2.thk;
                e1.baseOD = e2.baseOD;
            }
        }

        if(selectedEdgeId) openPanel(selectedEdgeId); 
        updateAllVisuals();
    }

    function toggleDiagonal() {
        diagDirection *= -1;
        updateGlobalTruss();
    }

    function getFabAngles(edge) {
        let p1 = nodes[edge.start];
        let p2 = nodes[edge.end];
        let axis = new THREE.Vector3().subVectors(p2, p1).normalize();
        
        let angBot = null, angTop = null;
        
        if (edge.type.includes('Vertical') || edge.type.includes('Diagonal')) {
            let axisTop = new THREE.Vector3().subVectors(nodes['N4'], nodes['N3']).normalize();
            let aT = axis.angleTo(axisTop) * (180 / Math.PI);
            angTop = Math.min(aT, 180 - aT); 
            
            let axisBot = new THREE.Vector3().subVectors(nodes['N2'], nodes['N1']).normalize();
            let aB = axis.angleTo(axisBot) * (180 / Math.PI);
            angBot = Math.min(aB, 180 - aB); 
        }
        return { angTop, angBot };
    }

    function getPlaneCutDistance(pt, axis, N, vA, vB) {
        let n = new THREE.Vector3().subVectors(vA, vB).normalize();
        let denom = axis.dot(n);
        if (Math.abs(denom) < 1e-6) return null;
        let num = new THREE.Vector3().subVectors(N, pt).dot(n);
        return num / denom;
    }

    function createCutPipeMesh(edge) {
        const p1 = nodes[edge.start];
        const p2 = nodes[edge.end];
        const len = p1.distanceTo(p2);
        
        const r = edge.baseOD / 2;
        const r_calc = (edge.baseOD / 2) - edge.thk; 
        
        const axis = new THREE.Vector3().subVectors(p2, p1).normalize();
        const W = new THREE.Vector3(0,0,1);
        const U = new THREE.Vector3().crossVectors(axis, W).normalize();
        let phaseDeg = parseFloat(document.getElementById('inp-phase').value) || 90;
        let phaseRad = phaseDeg * (Math.PI / 180);

        const segments = 36;
        const pts = [];

        const isMiterRight = document.getElementById('glb-miter-right') && document.getElementById('glb-miter-right').value === '1';

        for(let i=0; i<=segments; i++) {
            const angle = (i / segments) * Math.PI * 2 + phaseRad;
            const radialVec = new THREE.Vector3().addScaledVector(W, Math.cos(angle)).addScaledVector(U, Math.sin(angle));
            
            const ptOrigin = p1.clone().addScaledVector(radialVec, r);
            const ptOriginCalc = p1.clone().addScaledVector(radialVec, r_calc);
            
            let cutStart = 0;   
            let cutEnd = len;   

            if (edge.type.includes('Main')) {
                const vertL = edges.find(e => e.id === 'E3');
                const extLeft = (vertL && vertL.isBuilt ? (vertL.baseOD / 2) : 0) + 50;
                cutStart = -extLeft; 
                cutEnd = len + 100;  
            }

            edges.forEach(otherEdge => {
                if(otherEdge.id === edge.id || !otherEdge.isBuilt) return;
                if(edge.type.includes('Vertical') && otherEdge.type.includes('Vertical')) return;
                if(edge.type.includes('Main')) return; 

                const op1 = nodes[otherEdge.start];
                const op2 = nodes[otherEdge.end];
                const oAxis = new THREE.Vector3().subVectors(op2, op1).normalize();
                const oRad = otherEdge.baseOD / 2;
                
                const dp = new THREE.Vector3().subVectors(ptOriginCalc, op1); 
                const cross1 = new THREE.Vector3().crossVectors(dp, oAxis);
                const cross2 = new THREE.Vector3().crossVectors(axis, oAxis);
                const A = cross2.lengthSq();
                const B = 2 * cross1.dot(cross2);
                const C = cross1.lengthSq() - (oRad * oRad);
                
                if(A > 1e-6) {
                    const desc = B*B - 4*A*C;
                    if(desc >= 0) {
                        const t1 = (-B - Math.sqrt(desc)) / (2*A);
                        const t2 = (-B + Math.sqrt(desc)) / (2*A);
                        [t1, t2].forEach(t => {
                            if(!isNaN(t)) {
                                if(t > -len*0.5 && t < len*0.5) cutStart = Math.max(cutStart, t);
                                else if(t > len*0.5 && t < len*1.5) cutEnd = Math.min(cutEnd, t);
                            }
                        });
                    }
                }
            });

            if (isMiterRight) {
                if (edge.id === 'E4') { 
                    let vA4 = new THREE.Vector3().subVectors(nodes['N2'], nodes['N4']).normalize();
                    let vB4 = new THREE.Vector3().subVectors(nodes['N3'], nodes['N4']).normalize();
                    let tTop = getPlaneCutDistance(ptOrigin, axis, nodes['N4'], vA4, vB4);
                    if (tTop !== null) cutEnd = tTop;

                    let vA2 = new THREE.Vector3().subVectors(nodes['N4'], nodes['N2']).normalize();
                    let vB2 = new THREE.Vector3().subVectors(nodes['N1'], nodes['N2']).normalize();
                    let tBot = getPlaneCutDistance(ptOrigin, axis, nodes['N2'], vA2, vB2);
                    if (tBot !== null) cutStart = tBot;
                }
                if (edge.id === 'E2') { 
                    let vA4 = new THREE.Vector3().subVectors(nodes['N3'], nodes['N4']).normalize();
                    let vB4 = new THREE.Vector3().subVectors(nodes['N2'], nodes['N4']).normalize();
                    let tRight = getPlaneCutDistance(ptOrigin, axis, nodes['N4'], vA4, vB4);
                    if (tRight !== null) cutEnd = tRight;
                }
                if (edge.id === 'E1') { 
                    let vA2 = new THREE.Vector3().subVectors(nodes['N1'], nodes['N2']).normalize();
                    let vB2 = new THREE.Vector3().subVectors(nodes['N4'], nodes['N2']).normalize();
                    let tRight = getPlaneCutDistance(ptOrigin, axis, nodes['N2'], vA2, vB2);
                    if (tRight !== null) cutEnd = tRight;
                }
            }

            pts.push( ptOrigin.clone().addScaledVector(axis, cutStart) );
            pts.push( ptOrigin.clone().addScaledVector(axis, cutEnd) );
        }

        const geo = new THREE.BufferGeometry();
        const positions = [];
        for(let i=0; i<segments; i++) {
            const pA = pts[i*2], pB = pts[i*2 + 1];
            const pC = pts[(i+1)*2], pD = pts[(i+1)*2 + 1];
            positions.push(pA.x, pA.y, pA.z,  pC.x, pC.y, pC.z,  pB.x, pB.y, pB.z);
            positions.push(pC.x, pC.y, pC.z,  pD.x, pD.y, pD.z,  pB.x, pB.y, pB.z);
        }
        geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geo.computeVertexNormals();
        return new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ color: edge.color, side: THREE.DoubleSide, transparent:true, opacity:0.95 }));
    }

    function updateAllVisuals() {
        edges.forEach(edge => {
            if (edge.lineMesh) scene.remove(edge.lineMesh);
            if (edge.pipeMesh) scene.remove(edge.pipeMesh);
        });
        
        helperMeshes.forEach(m => scene.remove(m));
        helperMeshes = [];
        const centroidGeo = new THREE.SphereGeometry(15, 8, 8);
        const centroidMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.3 });
        ['N1', 'N2', 'N3', 'N4'].forEach(id => {
            const s = new THREE.Mesh(centroidGeo, centroidMat);
            s.position.copy(nodes[id]);
            scene.add(s);
            helperMeshes.push(s);
        });

        while(labelsGroup.children.length > 0){ 
            labelsGroup.remove(labelsGroup.children[0]); 
        }

        const isMiterRight = document.getElementById('glb-miter-right') && document.getElementById('glb-miter-right').value === '1';
        const vertL = edges.find(e => e.id === 'E3');
        const vertR = edges.find(e => e.id === 'E4');

        edges.forEach(edge => {
            let p1 = nodes[edge.start].clone();
            let p2 = nodes[edge.end].clone();
            const matLine = new THREE.LineBasicMaterial({ color: (selectedEdgeId === edge.id) ? 0xffffff : edge.color, linewidth: 3 });
            const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([p1, p2]), matLine);
            line.userData = { edgeId: edge.id };
            scene.add(line);
            edge.lineMesh = line;

            if (edge.isBuilt) {
                let useCutMesh = !edge.type.includes('Main');
                if (edge.type.includes('Main') && isMiterRight) {
                    if (edge.id === 'E1' || edge.id === 'E2') useCutMesh = true;
                }

                if (!useCutMesh) {
                    const extLeft = (vertL.isBuilt ? (vertL.baseOD / 2) : 0) + 50;
                    const extRight = (vertR.isBuilt ? (vertR.baseOD / 2) : 0) + 50;
                    const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
                    p1.addScaledVector(dir, -extLeft);
                    p2.addScaledVector(dir, extRight);
                    const d = p1.distanceTo(p2); 
                    const pGeo = new THREE.CylinderGeometry(edge.baseOD/2, edge.baseOD/2, d, 32, 1, false);
                    pGeo.translate(0, d/2, 0); pGeo.rotateX(Math.PI/2);
                    const mesh = new THREE.Mesh(pGeo, new THREE.MeshPhongMaterial({ color: edge.color, transparent:true, opacity:0.7 }));
                    mesh.position.copy(p1); mesh.lookAt(p2);
                    scene.add(mesh); edge.pipeMesh = mesh;
                } else {
                    const mesh = createCutPipeMesh(edge);
                    scene.add(mesh); edge.pipeMesh = mesh;

                    if (edge.type.includes('Vertical') || edge.type.includes('Diagonal')) {
                        const data = getCutData(edge);
                        const maxCutLen = (Math.max(...data.cutE) - Math.min(...data.cutS)).toFixed(1);
                        const angles = getFabAngles(edge);

                        let midPt = new THREE.Vector3().lerpVectors(nodes[edge.start], nodes[edge.end], 0.5);
                        let divLen = document.createElement('div');
                        divLen.className = 'meas-label';
                        divLen.innerHTML = `L: ${maxCutLen}`; 
                        let labelLen = new THREE.CSS2DObject(divLen);
                        labelLen.position.copy(midPt);
                        labelsGroup.add(labelLen);

                        if (angles.angTop !== null) {
                            let np1 = nodes[edge.start];
                            let np2 = nodes[edge.end];
                            let isP1Top = np1.y > np2.y;
                            
                            let ptTop = new THREE.Vector3().lerpVectors(np1, np2, isP1Top ? 0.2 : 0.8);
                            let divAngT = document.createElement('div');
                            divAngT.className = 'meas-label angle-label';
                            divAngT.innerHTML = `${angles.angTop.toFixed(1)}&deg;`; 
                            let labelAngT = new THREE.CSS2DObject(divAngT);
                            labelAngT.position.copy(ptTop);
                            labelsGroup.add(labelAngT);

                            let ptBot = new THREE.Vector3().lerpVectors(np1, np2, isP1Top ? 0.8 : 0.2);
                            let divAngB = document.createElement('div');
                            divAngB.className = 'meas-label angle-label';
                            divAngB.innerHTML = `${angles.angBot.toFixed(1)}&deg;`; 
                            let labelAngB = new THREE.CSS2DObject(divAngB);
                            labelAngB.position.copy(ptBot);
                            labelsGroup.add(labelAngB);
                        }
                    }
                }
            }
        });
    }

    function onPointerDown(event) {
        const container = document.getElementById('canvas-container');
        const rect = container.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / container.clientWidth) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / container.clientHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(edges.map(e => e.lineMesh));
        if (intersects.length > 0) openPanel(intersects[0].object.userData.edgeId);
    }

    function openPanel(edgeId) {
        selectedEdgeId = edgeId;
        const edge = edges.find(e => e.id === edgeId);
        
        let typeText = edge.type;
        document.getElementById('panel-title').innerText = typeText;
        document.getElementById('panel-title').removeAttribute('data-i18n'); 
        
        document.getElementById('inp-od').value = edge.baseOD;
        document.getElementById('inp-thk').value = edge.thk;
        document.getElementById('inp-len').value = nodes[edge.start].distanceTo(nodes[edge.end]).toFixed(1);

        const isMiterRight = document.getElementById('glb-miter-right') && document.getElementById('glb-miter-right').value === '1';
        const btnDxf = document.getElementById('btn-dxf');
        const btnPdf = document.getElementById('btn-pdf');
        const phaseGrp = document.getElementById('phase-group');
        
        let isExportable = !edge.type.includes('Main');
        if (isMiterRight && (edge.id === 'E1' || edge.id === 'E2')) {
            isExportable = true;
        }

        if (!isExportable) {
            btnDxf.classList.add('hidden'); btnPdf.classList.add('hidden'); phaseGrp.classList.add('hidden');
        } else {
            btnDxf.classList.remove('hidden'); btnPdf.classList.remove('hidden'); phaseGrp.classList.remove('hidden');
        }

        document.getElementById('property-panel').classList.add('active');
        setTimeout(() => document.getElementById('property-panel').style.transform = 'translateX(0)', 10);
        updateAllVisuals();
    }

    function closePanel() {
        selectedEdgeId = null;
        document.getElementById('property-panel').style.transform = 'translateX(120%)';
        setTimeout(() => document.getElementById('property-panel').classList.remove('active'), 300);
        updateAllVisuals();
    }

    function applyChanges() {
        if (!selectedEdgeId) return;
        const edge = edges.find(e => e.id === selectedEdgeId);
        edge.baseOD = parseFloat(document.getElementById('inp-od').value);
        edge.thk = parseFloat(document.getElementById('inp-thk').value);
        edge.isBuilt = true; 
        updateGlobalTruss(); 
    }

    function getCutData(edge) {
        const p1 = nodes[edge.start];
        const p2 = nodes[edge.end];
        const len = p1.distanceTo(p2);
        
        const r = edge.baseOD / 2;
        const r_calc = (edge.baseOD / 2) - edge.thk;

        const axis = new THREE.Vector3().subVectors(p2, p1).normalize();
        const W = new THREE.Vector3(0,0,1);
        const U = new THREE.Vector3().crossVectors(axis, W).normalize();
        const segments = 360; 
        const circum = Math.PI * edge.baseOD;
        let phaseDeg = parseFloat(document.getElementById('inp-phase').value) || 90;
        let phaseRad = phaseDeg * (Math.PI / 180);

        let cutS = []; let cutE = [];
        const isMiterRight = document.getElementById('glb-miter-right') && document.getElementById('glb-miter-right').value === '1';

        for(let i=0; i<=segments; i++) {
            const angle = (i / segments) * Math.PI * 2 + phaseRad;
            const radialVec = new THREE.Vector3().addScaledVector(W, Math.cos(angle)).addScaledVector(U, Math.sin(angle));
            
            const ptOrigin = p1.clone().addScaledVector(radialVec, r);
            const ptOriginCalc = p1.clone().addScaledVector(radialVec, r_calc);
            
            let cutStart = 0; let cutEnd = len; 

            if (edge.type.includes('Main')) {
                const vertL = edges.find(e => e.id === 'E3');
                const extLeft = (vertL && vertL.isBuilt ? (vertL.baseOD / 2) : 0) + 50;
                cutStart = -extLeft; 
                cutEnd = len + 100;
            }

            edges.forEach(otherEdge => {
                if(otherEdge.id === edge.id || !otherEdge.isBuilt) return;
                if(edge.type.includes('Vertical') && otherEdge.type.includes('Vertical')) return;
                if(edge.type.includes('Main')) return;

                const op1 = nodes[otherEdge.start]; const op2 = nodes[otherEdge.end];
                const oAxis = new THREE.Vector3().subVectors(op2, op1).normalize();
                const oRad = otherEdge.baseOD / 2;
                
                const dp = new THREE.Vector3().subVectors(ptOriginCalc, op1);
                
                const cross1 = new THREE.Vector3().crossVectors(dp, oAxis);
                const cross2 = new THREE.Vector3().crossVectors(axis, oAxis);
                const A = cross2.lengthSq();
                const B = 2 * cross1.dot(cross2);
                const C = cross1.lengthSq() - (oRad * oRad);
                
                if(A > 1e-6) {
                    const desc = B*B - 4*A*C;
                    if(desc >= 0) {
                        const t1 = (-B - Math.sqrt(desc)) / (2*A);
                        const t2 = (-B + Math.sqrt(desc)) / (2*A);
                        [t1, t2].forEach(t => {
                            if(!isNaN(t)) {
                                if(t > -len*0.5 && t < len*0.5) cutStart = Math.max(cutStart, t);
                                else if(t > len*0.5 && t < len*1.5) cutEnd = Math.min(cutEnd, t);
                            }
                        });
                    }
                }
            });

            if (isMiterRight) {
                if (edge.id === 'E4') {
                    let vA4 = new THREE.Vector3().subVectors(nodes['N2'], nodes['N4']).normalize();
                    let vB4 = new THREE.Vector3().subVectors(nodes['N3'], nodes['N4']).normalize();
                    let tTop = getPlaneCutDistance(ptOrigin, axis, nodes['N4'], vA4, vB4);
                    if (tTop !== null) cutEnd = tTop;

                    let vA2 = new THREE.Vector3().subVectors(nodes['N4'], nodes['N2']).normalize();
                    let vB2 = new THREE.Vector3().subVectors(nodes['N1'], nodes['N2']).normalize();
                    let tBot = getPlaneCutDistance(ptOrigin, axis, nodes['N2'], vA2, vB2);
                    if (tBot !== null) cutStart = tBot;
                }
                if (edge.id === 'E2') {
                    let vA4 = new THREE.Vector3().subVectors(nodes['N3'], nodes['N4']).normalize();
                    let vB4 = new THREE.Vector3().subVectors(nodes['N2'], nodes['N4']).normalize();
                    let tRight = getPlaneCutDistance(ptOrigin, axis, nodes['N4'], vA4, vB4);
                    if (tRight !== null) cutEnd = tRight;
                }
                if (edge.id === 'E1') {
                    let vA2 = new THREE.Vector3().subVectors(nodes['N1'], nodes['N2']).normalize();
                    let vB2 = new THREE.Vector3().subVectors(nodes['N4'], nodes['N2']).normalize();
                    let tRight = getPlaneCutDistance(ptOrigin, axis, nodes['N2'], vA2, vB2);
                    if (tRight !== null) cutEnd = tRight;
                }
            }

            cutS.push(cutStart); cutE.push(cutEnd);
        }
        return { cutS, cutE, circum, len, segments };
    }

    function generateCNC_DXF() {
        const edge = edges.find(e => e.id === selectedEdgeId);
        if(!edge) return;
        const data = getCutData(edge);
        
        let minY = Math.min(...data.cutS);
        const cutS = data.cutS.map(y => y - minY);
        const cutE = data.cutE.map(y => y - minY);

        let dxf = '0\nSECTION\n2\nHEADER\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n';
        const addLine = (x1, y1, x2, y2) => {
            if(!isNaN(x1) && !isNaN(y1) && !isNaN(x2) && !isNaN(y2)) {
                dxf += `0\nLINE\n8\n0\n10\n${x1.toFixed(3)}\n20\n${y1.toFixed(3)}\n30\n0.0\n11\n${x2.toFixed(3)}\n21\n${y2.toFixed(3)}\n31\n0.0\n`;
            }
        };

        for(let i=0; i<data.segments; i++) {
            let x1 = (i / data.segments) * data.circum;
            let x2 = ((i + 1) / data.segments) * data.circum;
            addLine(x1, cutS[i], x2, cutS[i+1]);
            addLine(x1, cutE[i], x2, cutE[i+1]);
        }
        addLine(0, cutS[0], 0, cutE[0]);
        addLine(data.circum, cutS[data.segments], data.circum, cutE[data.segments]);
        dxf += '0\nENDSEC\n0\nEOF\n';

        const blob = new Blob([dxf], { type: 'application/dxf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${edge.type.replace(/\s+/g, '_')}_CNC.dxf`;
        link.click();
    }

    function generateTemplate_PDF() {
        const edge = edges.find(e => e.id === selectedEdgeId);
        if(!edge) return;
        
        const { jsPDF } = window.jspdf;
        const paperSize = document.getElementById('inp-paper').value; 
        const orient = document.getElementById('inp-orient').value; 
        
        const doc = new jsPDF({ orientation: orient, format: paperSize, unit: 'mm' });
        
        const data = getCutData(edge);
        const trueMaxLen = (Math.max(...data.cutE) - Math.min(...data.cutS)).toFixed(1);

        let minStart = Math.min(...data.cutS);
        const cutS = data.cutS.map(y => y - minStart);
        let maxEnd = Math.max(...data.cutE);
        const depthE = data.cutE.map(y => maxEnd - y); 

        const maxCutStart = Math.max(...cutS);
        const maxCutEnd = Math.max(...depthE);
        const marginY = 20; 
        const marginX = 15; 

        const reqWidth = data.circum + (marginX * 2);
        const reqHeight = maxCutStart + marginY + maxCutEnd + marginY + 45; 
        
        const paperDimPortrait = { 'a4': {w:210, h:297}, 'a3': {w:297, h:420}, 'a2': {w:420, h:594}, 'a1': {w:594, h:841}, 'a0': {w:841, h:1189} };
        const pw = orient === 'landscape' ? paperDimPortrait[paperSize].h : paperDimPortrait[paperSize].w;
        const ph = orient === 'landscape' ? paperDimPortrait[paperSize].w : paperDimPortrait[paperSize].h;
        
        if (reqWidth > pw || reqHeight > ph) {
            alert(i18n['alert_pdf'][currentLang]);
        }

        doc.setFontSize(10);
        let startY = 20; 
        
        doc.setLineWidth(0.5);
        doc.text("Part 1: Start Cut", marginX, startY - 5);
        doc.setDrawColor(200, 200, 200); 
        doc.line(marginX, startY + maxCutStart + marginY, marginX + data.circum, startY + maxCutStart + marginY);
        
        doc.setDrawColor(0, 0, 0);
        for(let i=0; i<data.segments; i++) {
            let x1 = marginX + (i / data.segments) * data.circum;
            let x2 = marginX + ((i + 1) / data.segments) * data.circum;
            doc.line(x1, startY + cutS[i], x2, startY + cutS[i+1]);
        }
        
        doc.setDrawColor(255, 0, 0); 
        doc.setLineDash([2, 2], 0);
        [0, 90, 180, 270, 360].forEach(deg => {
            let x = marginX + (deg / 360) * data.circum;
            doc.line(x, startY - 5, x, startY + maxCutStart + marginY);
            doc.text(`${deg}` + String.fromCharCode(176), x - 3, startY - 7);
        });
        doc.setLineDash([]); 

        let gapY = startY + maxCutStart + marginY + 15; 
        doc.setFontSize(11);
        doc.text(`Template: ${edge.type} (OD ${edge.baseOD} mm)`, marginX + 10, gapY);
        doc.text(`Max Cut Length: ${trueMaxLen} mm`, marginX + 10, gapY + 6);
        doc.setFontSize(9);
        doc.text(`* Print at 100% Scale (Do not fit to page)`, marginX + 10, gapY + 12);
        doc.setFontSize(10); 

        let startY2 = gapY + 25; 
        doc.setDrawColor(0, 0, 0);
        doc.text("Part 2: End Cut", marginX, startY2 - 5);
        
        doc.setDrawColor(200, 200, 200);
        doc.line(marginX, startY2, marginX + data.circum, startY2);
        
        doc.setDrawColor(0, 0, 0);
        for(let i=0; i<data.segments; i++) {
            let x1 = marginX + (i / data.segments) * data.circum;
            let x2 = marginX + ((i + 1) / data.segments) * data.circum;
            doc.line(x1, startY2 + marginY + maxCutEnd - depthE[i], x2, startY2 + marginY + maxCutEnd - depthE[i+1]);
        }

        doc.setDrawColor(255, 0, 0);
        doc.setLineDash([2, 2], 0);
        [0, 90, 180, 270, 360].forEach(deg => {
            let x = marginX + (deg / 360) * data.circum;
            doc.line(x, startY2, x, startY2 + marginY + maxCutEnd + 5);
            doc.text(`${deg}` + String.fromCharCode(176), x - 3, startY2 + marginY + maxCutEnd + 10);
        });
        doc.setLineDash([]);

        doc.save(`${edge.type.replace(/\s+/g, '_')}_Template.pdf`);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
        if(labelRenderer) labelRenderer.render(scene, camera);
    }
</script>
